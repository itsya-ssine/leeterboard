<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d12" />
    <script>
      // Apply the saved (or system) theme before first paint so there's no
      // flash of the wrong one. Keep in sync with src/theme.tsx.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("leeterboard:theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "light") {
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f4f6f9");
        }
      })();
    </script>
    <meta
      name="description"
      content="Leeterboard — the weekly LeetCode leaderboard."
    />
    <link rel="canonical" href="https://leaderboard-leet.vercel.app/" />

    <!-- Social preview (Discord, LinkedIn, X, Slack...). The image and URLs must
         be absolute: crawlers don't resolve relative paths. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Leeterboard" />
    <meta property="og:url" content="https://leaderboard-leet.vercel.app/" />
    <meta property="og:title" content="Leeterboard" />
    <meta
      property="og:description"
      content="A live competitive-programming leaderboard for friends, classes and clubs: weekly ranks, streaks, badges and head-to-head comparisons across LeetCode, Codeforces and CodinGame."
    />
    <meta property="og:image" content="https://leaderboard-leet.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Leeterboard: the weekly LeetCode leaderboard."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Leeterboard" />
    <meta
      name="twitter:description"
      content="Weekly ranks, streaks, badges and head-to-head comparisons for your LeetCode group."
    />
    <meta name="twitter:image" content="https://leaderboard-leet.vercel.app/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Leeterboard: the weekly LeetCode leaderboard."
    />
    <link
      rel="icon"
      href="/favicon.svg"
      type="image/svg+xml"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>Leeterboard — Weekly LeetCode sprint</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
